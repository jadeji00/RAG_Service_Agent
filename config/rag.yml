chat_model_name: qwen-max
embedding_model_name: text-embedding-v4

# ===== 检索管线 =====
# mode: hybrid = 向量 + BM25 双路召回后 RRF 融合；vector = 只走向量（评测 A/B 用）。
# 候选数指每一路各取多少条去融合，最终返回条数仍由 chroma.yml 的 k 或调用方传入的 k 决定。
# rrf_k 是 RRF 的平滑常数，越大越「平权」，60 是论文里的常用默认值。
retrieval:
  mode: hybrid
  vector_candidates: 20
  bm25_candidates: 20
  rrf_k: 60
  # 重排：把融合后的 candidates 条候选交给交叉编码器逐条打分再截断。
  # 调用失败（网络/限流/鉴权）会自动退回 RRF 顺序，不影响可用性。
  # min_score 是「没有证据」的阈值：最高分低于它就返回空，上层直接拒答而不是硬编。
  # 0.16 由 eval/calibrate_min_score.py 标定：75 道 answerable 最低分 0.1673，
  # 5 道未被服务范围路由拦下的 negative 最高分 0.1578，取可分区间内的值。
  # 换语料或换重排模型后要重新标定。
  rerank:
    enabled: true
    model: gte-rerank-v2
    candidates: 20
    min_score: 0.16
