# 观测数据落盘位置（trace / token 账本），相对项目根目录
db_path: checkpoints/observability.sqlite3

# 成本估算单价，单位：元 / 1K tokens。
# 仅用于演示和相对比较，实际金额以百炼控制台账单为准；
# 换模型或调价后请同步修改这里，不要改代码。
pricing:
  qwen-max:
    input_per_1k: 0.0024
    output_per_1k: 0.0096
  # 会话历史压缩用的摘要模型。qwen-flash 是阶梯计费，这里填最低档
  # （单次输入 ≤128K tokens：0.15 / 1.5 元每百万 tokens）；压缩请求的对话稿
  # 远小于 128K，所以不会跳到更高档。
  qwen-flash:
    input_per_1k: 0.00015
    output_per_1k: 0.0015

currency: CNY
